<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html, body {
            width: 420px;
            height: 250px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            box-sizing: border-box;
            overflow: hidden;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .icon {
            font-size: 24px;
            margin-right: 10px;
        }
        h1 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        .anime-info {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .anime-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .episode-info {
            color: #666;
        }
        .buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }
        .btn-confirm {
            background: #4CAF50;
            color: white;
        }
        .btn-confirm:hover {
            background: #45a049;
        }
        .btn-cancel {
            background: #f44336;
            color: white;
        }
        .btn-cancel:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="icon">🤔</span>
        <h1>Mettre à jour Anilist ?</h1>
    </div>

    <div class="anime-info">
        <div class="anime-title" id="animeTitle">Loading...</div>
        <div class="episode-info" id="episodeInfo">Loading...</div>
    </div>

    <div class="buttons">
        <button id="cancelBtn" class="btn-cancel">❌ Non, ignorer</button>
        <button id="confirmBtn" class="btn-confirm">✅ Oui, mettre à jour</button>
    </div>

    <script src="confirm.js"></script>
</body>
</html>

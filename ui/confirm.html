<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            width: 380px;
            min-height: 180px;
            padding: 0;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        body {
            padding: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        .icon {
            font-size: 20px;
            line-height: 1;
        }
        h1 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            line-height: 1.3;
        }
        .anime-info {
            background: #f5f5f5;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 14px;
        }
        .anime-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
            color: #333;
            line-height: 1.4;
        }
        .episode-info {
            color: #666;
            font-size: 13px;
            line-height: 1.4;
        }
        .buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        button {
            padding: 8px 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
            line-height: 1.4;
        }
        .btn-confirm {
            background: #4CAF50;
            color: white;
        }
        .btn-confirm:hover {
            background: #45a049;
        }
        .btn-cancel {
            background: #f44336;
            color: white;
        }
        .btn-cancel:hover {
            background: #da190b;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="icon">🤔</span>
        <h1>Mettre à jour Anilist ?</h1>
    </div>

    <div class="anime-info">
        <div class="anime-title" id="animeTitle">Loading...</div>
        <div class="episode-info" id="episodeInfo">Loading...</div>
    </div>

    <div class="buttons">
        <button id="cancelBtn" class="btn-cancel">❌ Non, ignorer</button>
        <button id="confirmBtn" class="btn-confirm">✅ Oui, mettre à jour</button>
    </div>

    <script src="confirm.js"></script>
</body>
</html>

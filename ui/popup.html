<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { 
      width: 320px; 
      padding: 20px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h3 {
      margin: 0 0 5px 0;
      color: #333;
    }
    
    .header p {
      margin: 0;
      color: #666;
      font-size: 12px;
    }
    
    button { 
      padding: 12px; 
      margin: 8px 0; 
      width: 100%; 
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5a67d8;
    }
    
    .btn-primary:disabled {
      background: #4CAF50;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #e2e8f0;
      color: #4a5568;
    }
    
    .btn-secondary:hover {
      background: #cbd5e0;
    }
    
    .btn-logout {
      background: #fed7d7;
      color: #c53030;
      font-size: 12px;
      padding: 8px;
      margin-top: 15px;
    }
    
    .btn-logout:hover {
      background: #feb2b2;
    }
    
    #status { 
      margin: 15px 0; 
      padding: 12px; 
      border-radius: 6px; 
      font-size: 13px;
      line-height: 1.4;
    }
    
    .success { 
      background: #f0fff4; 
      color: #22543d; 
      border: 1px solid #9ae6b4;
    }
    
    .error { 
      background: #fef5e7; 
      color: #c05621; 
      border: 1px solid #f6ad55;
    }
    
    .user-info {
      background: #edf2f7;
      padding: 10px;
      border-radius: 6px;
      margin: 10px 0;
      font-size: 13px;
    }
    
    .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>AniList Auto Updater</h3>
    <p>Synchronise automatiquement vos animes regardés</p>
  </div>
  
  <div id="status"></div>
  <div id="userInfo" class="user-info" style="display: none;"></div>
  
  <button id="login" class="btn-primary">Se connecter à AniList</button>
  <button id="test" class="btn-secondary">Tester la connexion</button>
  
  <div class="divider"></div>
  
  <button id="logout" class="btn-logout" style="display: none;">Se déconnecter</button>
  
  <script src="popup.js"></script>
</body>
</html>
